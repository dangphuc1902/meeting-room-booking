services:
  db:
    image: postgres:16-alpine
    container_name: meeting-room-db
    environment:
      POSTGRES_DB: ${DB_NAME:-meeting_room}
      POSTGRES_USER: ${DB_USER:-meeting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meeting}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meeting} -d ${DB_NAME:-meeting_room}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: meeting-room-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-meeting_room}
      DB_USER: ${DB_USER:-meeting}
      DB_PASSWORD: ${DB_PASSWORD:-meeting}
      APP_JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.local}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
