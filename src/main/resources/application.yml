spring:
  application:
    name: meeting-room-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeting_room}
    username: ${DB_USER:meeting}
    password: ${DB_PASSWORD:meeting}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true               # RFC 7807 for framework errors (404 route, 405, 415...)
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  # Business time zone: working hours and "a day" are evaluated here. Storage is always UTC.
  zone-id: Asia/Ho_Chi_Minh
  jwt:
    # Empty when unset (an unresolved ${...} would be taken literally), so validation stops startup.
    # Only the demo profile has a default.
    secret: ${APP_JWT_SECRET:}
    issuer: meeting-room-booking
    ttl: 8h
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@company.local}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}   # same: blank fails @NotBlank at startup
      full-name: System Administrator
  booking:
    working-day-start: "07:00"
    working-day-end: "20:00"
    working-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
    slot-minutes: 15
    min-duration: 15m
    max-duration: 8h
    max-advance: 90d
    max-schedule-range: 31d

logging:
  level:
    root: INFO
    com.company.meetingroom: INFO
